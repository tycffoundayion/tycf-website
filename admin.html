<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYCF Admin Login</title>
<style>
body{font-family:Arial;background:#e8f5ec;display:grid;place-items:center;min-height:90vh}
.box{background:white;padding:28px;border-radius:14px;width:85%;max-width:380px}
h2{text-align:center;color:#075b3c}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0}
input{border:1px solid #ccc;border-radius:6px}
button{background:#075b3c;color:white;border:0;border-radius:6px;font-size:16px}
#msg{text-align:center;color:#b00020}
</style>
</head>
<body>
<div class="box">
<h2>TYCF Admin Login</h2>
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p id="msg"></p>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
'https://mswgamuswyvqxscfcyff.supabase.co',
'sb_publishable_gxRXwlD9V6Nfg-6g10Bzig_mJwivK9u'
);

document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();

const msg = document.getElementById('msg');
msg.textContent = 'Checking login...';

const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

const { data, error } = await supabase.auth.signInWithPassword({
email, password
});

if (error) {
msg.textContent = error.message;
return;
}

const { data: admin, error: adminError } = await supabase
.from('tycf_admins')
.select('user_id')
.eq('user_id', data.user.id)
.maybeSingle();

if (adminError || !admin) {
await supabase.auth.signOut();
msg.textContent = 'Admin access not allowed';
return;
}

window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
