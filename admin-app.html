<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b3c"><link rel="manifest" href="/admin-app.webmanifest"><title>TYCF Admin Orders</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#edf5ef;color:#173b2d;font:15px Arial,sans-serif}header{background:#075b3c;color:white;padding:18px 16px;position:sticky;top:0;z-index:2}header h1{font-size:20px;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.85}main{max-width:900px;margin:auto;padding:14px}.panel,.order,.stat{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #1231}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat span{font-size:12px;color:#557064}.stat strong{display:block;font-size:24px;margin-top:5px}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #bfd2c5}button{background:#075b3c;color:white;border:0;font-weight:600}button.secondary{background:white;color:#075b3c;border:1px solid #b8d4c2}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1}input,select{width:100%;margin:6px 0 10px}.order h3{margin:0}.muted{color:#60776b;font-size:13px}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#e3f3e8;font-size:12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.detail div{background:#f4f8f5;padding:9px;border-radius:8px;overflow-wrap:anywhere}.detail small{display:block;color:#60776b;margin-bottom:3px}.photos{display:flex;gap:10px;flex-wrap:wrap}.photos img{width:min(100%,220px);max-height:230px;object-fit:contain;background:#f4f8f5;border-radius:8px}.hidden{display:none!important}#msg{padding:10px;background:#fff;border-radius:8px;margin:8px 0}.order select{margin:8px 0}.order button{margin:3px 0}.order label{font-size:13px;font-weight:bold}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>TYCF Admin Orders</h1><p>Admin-only · Orders management · No customer booking</p></header>
<main>
<section id="login" class="panel"><h2>Admin Login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button type="submit">Login</button></form></section>
<section id="app" class="hidden">
<div class="bar"><button id="refresh" type="button">Refresh Orders</button><button class="secondary" id="push" type="button">Enable Notifications</button><button class="secondary" id="logout" type="button">Logout</button></div>
<div id="msg" role="status">Loading orders…</div>
<div class="grid"><div class="stat"><span>Total Orders</span><strong id="total">0</strong></div><div class="stat"><span>New / Received</span><strong id="new">0</strong></div><div class="stat"><span>Confirmed</span><strong id="confirmed">0</strong></div><div class="stat"><span>Delivered</span><strong id="delivered">0</strong></div></div>
<div class="panel"><input id="search" placeholder="Search customer, phone, package"><select id="filter"><option value="">All orders</option><option>Received</option><option>Confirmed</option><option>Preparing</option><option>Delivered</option><option>Cancelled</option></select><div id="orders"></div></div>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const sb=createClient('https://mswgamusywvqxscfcyff.supabase.co','sb_publishable_gxRXwlD9V6Nfg-6g10Bzig_mJwivK9u');
const $=id=>document.getElementById(id);let rows=[],currentUser=null;
function say(t){$('msg').textContent=t}
async function checkAdmin(){const{data:{user},error}=await sb.auth.getUser();if(error||!user)return false;const{data,error:e}=await sb.from('tycf_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(e)throw e;if(!data){await sb.auth.signOut();throw Error('Admin access not allowed')}currentUser=user;return true}
async function start(){if(await checkAdmin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();say('Checking admin login…');const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){alert(error.message);return}try{await start()}catch(x){alert(x.message)}});
async function signedPhoto(path){if(!path)return null;const{data,error}=await sb.storage.from('tycf-sticker-photos').createSignedUrl(path,300);return error?null:data?.signedUrl}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
async function load(){say('Loading orders…');const{data,error}=await sb.from('tycf_orders').select('*').order('created_at',{ascending:false}).limit(250);if(error){say('Could not load orders: '+error.message);return}rows=data||[];$('total').textContent=rows.length;$('new').textContent=rows.filter(x=>x.status==='Received').length;$('confirmed').textContent=rows.filter(x=>x.status==='Confirmed').length;$('delivered').textContent=rows.filter(x=>x.status==='Delivered').length;await render();say('Orders updated.')}
async function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const list=rows.filter(o=>(!f||o.status===f)&&[o.customer_name,o.customer_mobile,o.package_name,o.whatsapp_recipient].some(v=>String(v||'').toLowerCase().includes(q)));if(!list.length){$('orders').innerHTML='<p class="muted">No matching orders.</p>';return}let out='';for(const o of list){const photo=await signedPhoto(o.sticker_photo_path),design=await signedPhoto(o.sticker_design_path);out+=`<article class="order"><div class="bar"><h3>Order #${esc(o.id)}</h3><span class="tag">${esc(o.status)}</span></div><div class="detail"><div><small>Customer</small>${esc(o.customer_name)}</div><div><small>WhatsApp / Mobile</small>${esc(o.whatsapp_recipient||o.customer_mobile)}</div><div><small>Package</small>${esc(o.package_name)}</div><div><small>Total Amount</small>${money(o.total_amount??o.package_price)}</div><div><small>Donation Date</small>${esc(o.donation_date)}</div><div><small>Payment</small>${esc(o.payment_status)}</div><div><small>Occasion</small>${esc(o.occasion)}</div><div><small>Sticker Name</small>${esc(o.sticker_name)}</div></div><p><b>Customer Message:</b> ${esc(o.customer_message||'—')}</p><div class="photos">${photo?`<img src="${photo}" alt="Customer uploaded photo">`:''}${design?`<img src="${design}" alt="Sticker design">`:''}</div><div class="panel"><label>Upload donation / delivery video (max 50 MB)</label><input type="file" accept="video/mp4,video/webm,image/jpeg,image/png,image/webp" id="media-${o.id}"><input id="caption-${o.id}" placeholder="Thank-you note / caption (optional)"><button data-upload="${o.id}" type="button">Upload Media</button><div id="media-list-${o.id}" class="muted">Loading uploaded media…</div></div><label>Update order status</label><select id="s-${o.id}">${['Received','Confirmed','Preparing','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button data-save="${o.id}">Save Status</button> <a href="https://wa.me/${esc((o.whatsapp_recipient||o.customer_mobile||'').replace(/\\D/g,''))}" target="_blank" rel="noopener"><button type="button" class="secondary">Open WhatsApp</button></a></article>`} $('orders').innerHTML=out;for(const o of list){const{data:media}=await sb.from('tycf_order_delivery_media').select('*').eq('order_id',o.id).order('created_at',{ascending:false});const el=$('media-list-'+o.id);if(el&&media?.length){let links=[];for(const m of media){const{data}=await sb.storage.from('tycf-delivery-media').createSignedUrl(m.media_path,300);if(data?.signedUrl)links.push('<div style="margin:8px 0"><a target="_blank" rel="noopener" href="'+data.signedUrl+'">Open '+esc(m.media_type)+' · '+esc(new Date(m.created_at).toLocaleString())+'</a> <button type="button" data-share="'+esc(m.id)+'" data-order="'+esc(o.id)+'">Send via WhatsApp</button></div>')}el.innerHTML=links.join('<br>')||'No media uploaded'}else if(el)el.textContent='No media uploaded'}}
$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('orders').addEventListener('click',async e=>{const share=e.target.closest('[data-share]');if(share){const mediaId=share.dataset.share,orderId=share.dataset.order,order=rows.find(x=>String(x.id)===String(orderId));share.disabled=true;share.textContent='Preparing…';try{const{data:media,error}=await sb.from('tycf_order_delivery_media').select('*').eq('id',mediaId).single();if(error)throw error;const{data:signed,error:signError}=await sb.storage.from('tycf-delivery-media').createSignedUrl(media.media_path,300);if(signError)throw signError;const response=await fetch(signed.signedUrl);if(!response.ok)throw Error('Could not download uploaded media');const blob=await response.blob();const filename=media.media_path.split('/').pop()||('TYCF-order-'+orderId);const file=new File([blob],filename,{type:blob.type|| (media.media_type==='video'?'video/mp4':'image/jpeg')});const message='Thank you for being part of TYCF Food Donation! ❤️\\nYour donation has brought happiness and food to those in need. Please find the donation video attached.\\n\\nWith gratitude,\\nTYCF Foundation';if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[file]}))throw Error('This browser cannot share video files. Open this app in Chrome on Android.');await navigator.share({files:[file],text:message,title:'TYCF Food Donation - Thank You'});say('WhatsApp share sheet opened. Select WhatsApp and tap Send to deliver the video with thank-you message.')}catch(err){if(err.name!=='AbortError')say('WhatsApp sharing error: '+err.message)}finally{share.disabled=false;share.textContent='Send via WhatsApp'}return}const up=e.target.closest('[data-upload]');if(up){const id=up.dataset.upload,file=$('media-'+id).files[0];if(!file){alert('Select a video or image first.');return}if(file.size>50*1024*1024){alert('File must be 50 MB or smaller.');return}const type=file.type.startsWith('video/')?'video':'image';if(!['video/mp4','video/webm','image/jpeg','image/png','image/webp'].includes(file.type)){alert('Supported: MP4, WebM, JPG, PNG, WebP.');return}up.disabled=true;up.textContent='Uploading…';try{const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase();const path='order-'+id+'/'+crypto.randomUUID()+'.'+ext;const{error:se}=await sb.storage.from('tycf-delivery-media').upload(path,file,{contentType:file.type,upsert:false});if(se)throw se;const{error:de}=await sb.from('tycf_order_delivery_media').insert({order_id:Number(id),media_path:path,media_type:type,caption:$('caption-'+id).value.trim()});if(de)throw de;await render();say('Media uploaded and saved to order #'+id+'. Automatic WhatsApp delivery is not configured yet.')}catch(err){say('Upload failed: '+err.message)}finally{up.disabled=false;up.textContent='Upload Media'}return}const b=e.target.closest('[data-save]');if(!b)return;const id=b.dataset.save,st=$('s-'+id).value,o=rows.find(x=>String(x.id)===String(id));if(st==='Confirmed'&&o?.payment_status!=='Paid'){alert('Verify payment before confirming in the main dashboard.');return}const{error}=await sb.from('tycf_orders').update({status:st}).eq('id',id);if(error){alert(error.message);return}await load()});
$('push').onclick=async()=>{try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('Push is not supported in this browser');const reg=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;let perm=Notification.permission;if(perm==='default')perm=await Notification.requestPermission();if(perm!=='granted')throw Error('Allow notifications in Android settings');const r=await fetch('https://mswgamusywvqxscfcyff.supabase.co/functions/v1/tycf-order-push',{cache:'no-store'});if(!r.ok)throw Error('Could not read VAPID public key');const j=await r.json();const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0));let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decode(j.publicKey||j.VAPID_PUBLIC_KEY)});const subscriptionData=sub.toJSON();const{error}=await sb.from('tycf_admin_push_subscriptions').upsert({user_id:currentUser.id,endpoint:subscriptionData.endpoint,p256dh:subscriptionData.keys.p256dh,auth:subscriptionData.keys.auth},{onConflict:'endpoint'});if(error)throw error;say('Push notifications enabled on this admin app')}catch(e){say('Push setup error: '+e.message)}};
try{await start()}catch(e){say(e.message)}
</script></body></html>
