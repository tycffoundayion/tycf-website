<h2>Admin Profile</h2>
<form id="profileForm">
  <label>Display Name</label>
  <input id="displayName" maxlength="60"
    placeholder="Enter display name" required>

  <label>New Login Email</label>
  <input id="newAdminEmail" type="email"
    placeholder="Enter new login email">

  <button type="submit">Save Profile</button>
</form>
<p class="muted">
  Login email change may require email confirmation.
</p>
<hr>
