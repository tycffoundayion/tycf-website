<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase=createClient(
  'https://mswgamusywvqxscfcyff.supabase.co',
  'sb_publishable_gxRXwlD9V6Nfg-6g10Bzig_mJwivK9u'
);

const $=id=>document.getElementById(id);
let orders=[];
let settings=null;
let currentEmail='';

function say(message){
  $('message').textContent=message;
}

function esc(value){
  return String(value??'').replace(/[&<>"']/g,char=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[char]));
}

function datePlus(days){
  const d=new Date();
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function validWhatsApp(value){
  let phone=String(value||'').replace(/\D/g,'');
  if(phone.length===10)phone='91'+phone;
  return phone.length>=11&&phone.length<=15?phone:'';
}

function confirmationMessage(order){
  return [
    'TYCF FOOD DONATION',
    '',
    'Dear '+(order.customer_name||'Customer')+',',
    'Your donation booking has been confirmed.',
    '',
    'Package: '+(order.package_name||''),
    'Donation Amount: Rs. '+Number(order.package_price||0).toLocaleString('en-IN'),
    'Donation Date: '+(order.donation_date||''),
    'Occasion: '+(order.occasion||''),
    '',
    'Payment Status: PAID',
    'Order Status: CONFIRMED',
    '',
    'Thank you for supporting TYCF Foundation.',
    'Sharing Happiness ❤️'
  ].join('\n');
}

function whatsappLink(order){
  const phone=validWhatsApp(order.whatsapp_recipient||order.customer_mobile);
  if(!phone)return '';
  return 'https://wa.me/'+phone+'?text='+encodeURIComponent(confirmationMessage(order));
}

/* ADMIN LOGIN CHECK */
async function init(){
  const {data:{session},error}=await supabase.auth.getSession();

  if(error||!session){
    location.href='admin.html';
    return;
  }

  const {data:admin,error:adminError}=await supabase
    .from('tycf_admins')
    .select('user_id')
    .eq('user_id',session.user.id)
    .maybeSingle();

  if(adminError||!admin){
    await supabase.auth.signOut();
    location.href='admin.html';
    return;
  }

  $('app').hidden=false;

  const profileName=session.user.user_metadata?.display_name||'TYCF Admin';
  currentEmail=session.user.email||'';

  $('adminDisplayName').textContent=profileName;
  $('displayName').value=profileName;
  $('newAdminEmail').value=currentEmail;

  await loadAll();
}

/* LOAD CUSTOMER PHOTO AND FINAL DESIGN */
async function loadOrderImages(list){
  await Promise.all(list.map(async order=>{
    order.stickerPhotoUrl=null;
    order.stickerDesignUrl=null;

    if(order.sticker_photo_path){
      const {data,error}=await supabase.storage
        .from('tycf-sticker-photos')
        .createSignedUrl(order.sticker_photo_path,3600);

      if(!error&&data?.signedUrl){
        order.stickerPhotoUrl=data.signedUrl;
      }else{
        console.warn('Customer photo URL error:',order.id,error);
      }
    }

    if(order.sticker_design_path){
      const {data,error}=await supabase.storage
        .from('tycf-sticker-photos')
        .createSignedUrl(order.sticker_design_path,3600);

      if(!error&&data?.signedUrl){
        order.stickerDesignUrl=data.signedUrl;
      }else{
        console.warn('Final design URL error:',order.id,error);
      }
    }
  }));
}

/* LOAD BOOKINGS AND SETTINGS */
async function loadAll(){
  say('Loading bookings and settings…');

  const [orderResult,settingsResult]=await Promise.all([
    supabase.from('tycf_orders')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(500),

    supabase.from('tycf_settings')
      .select('*')
      .limit(1)
      .maybeSingle()
  ]);

  if(orderResult.error){
    say('Bookings error: '+orderResult.error.message);
    return;
  }

  if(settingsResult.error){
    say('Settings error: '+settingsResult.error.message);
    return;
  }

  orders=orderResult.data||[];
  settings=settingsResult.data;

  if(!settings){
    say('No settings row found in tycf_settings. Please check setup.');
    return;
  }

  await loadOrderImages(orders);
  renderOrders();
  renderStats();
  fillSettings();
  renderReminders();
  say('Dashboard loaded.');
}

function renderStats(){
  $('total').textContent=orders.length;
  $('received').textContent=orders.filter(o=>o.status==='Received').length;
  $('confirmed').textContent=orders.filter(o=>o.status==='Confirmed').length;
  $('delivered').textContent=orders.filter(o=>o.status==='Delivered').length;
}

/* BOOKING DISPLAY */
function orderMarkup(order){
  const paid=order.payment_status==='Paid';
  const statuses=['Received','Confirmed','Preparing','Delivered','Cancelled'];

  const statusOptions=statuses.map(status=>{
    const blocked=status==='Confirmed'&&!paid;
    return `<option value="${status}" ${order.status===status?'selected':''} ${blocked?'disabled':''}>${status}${blocked?' (Verify payment first)':''}</option>`;
  }).join('');

  const photo=order.stickerPhotoUrl
    ? `<div class="order-image-card">
        <strong>Customer Uploaded Photo</strong>
        <a href="${esc(order.stickerPhotoUrl)}" target="_blank" rel="noopener">
          <img src="${esc(order.stickerPhotoUrl)}" alt="Customer photo" loading="lazy">
        </a>
      </div>`
    : (order.sticker_photo_path
      ? '<p class="image-missing">Customer photo is saved, but preview is unavailable. Check Storage read permission.</p>'
      : '');

  const design=order.stickerDesignUrl
    ? `<div class="order-image-card">
        <strong>Final Sticker Design</strong>
        <a href="${esc(order.stickerDesignUrl)}" target="_blank" rel="noopener">
          <img src="${esc(order.stickerDesignUrl)}" alt="Final sticker design" loading="lazy">
        </a>
      </div>`
    : (order.sticker_design_path
      ? '<p class="image-missing">Final design is saved, but preview is unavailable. Check Storage read permission.</p>'
      : '');

  const link=paid?whatsappLink(order):'';

  return `
    <article class="order">
      <h3>${esc(order.customer_name)} <span class="tag">${esc(order.status)}</span></h3>
      <p><b>${esc(order.package_name)}</b> — ₹${esc(order.package_price)}</p>
      <p class="muted">Mobile: ${esc(order.customer_mobile)} · Occasion: ${esc(order.occasion)} · Donation date: ${esc(order.donation_date)}</p>
      <p class="muted">Sticker name: ${esc(order.sticker_name)} · Message: ${esc(order.customer_message)}</p>

      ${photo||design?`<div class="order-images">${photo}${design}</div>`:''}

      <p><b>Payment Status:</b>
        <span class="tag ${paid?'paid':'pending'}">${paid?'Paid':'Pending'}</span>
      </p>

      <div class="wa-box">
        <label for="wa-${esc(order.id)}">Customer WhatsApp Number</label>
        <input id="wa-${esc(order.id)}" type="tel" inputmode="numeric" maxlength="15" value="${esc(order.whatsapp_recipient||order.customer_mobile||'')}" placeholder="919876543210">
        <button type="button" data-save-wa="${esc(order.id)}">Save WhatsApp Number</button>
        <p class="muted">This number can be changed without changing the original booking mobile number.</p>
      </div>

      <div class="actions">
        ${!paid?`<button data-verify="${esc(order.id)}">Verify Payment / Mark Paid</button>`:''}
        <select id="st-${esc(order.id)}" aria-label="Booking status">${statusOptions}</select>
        <button data-save="${esc(order.id)}">Save Status</button>
        ${link?`<a class="btn" href="${link}" target="_blank" rel="noopener">Send WhatsApp Confirmation</a>`:''}
        ${paid&&!link?'<span class="muted">Invalid WhatsApp number. Please check it.</span>':''}
      </div>
    </article>`;
}

function renderOrders(){
  const query=$('search').value.toLowerCase();
  const filter=$('statusFilter').value;

  const filtered=orders.filter(order=>
    (!filter||order.status===filter)&&
    [
      order.customer_name,
      order.customer_mobile,
      order.package_name,
      order.whatsapp_recipient
    ].some(value=>String(value||'').toLowerCase().includes(query))
  );

  $('ordersList').innerHTML=filtered.length
    ?filtered.map(orderMarkup).join('')
    :'<p>No matching bookings.</p>';

  document.querySelectorAll('[data-save]').forEach(button=>{
    button.addEventListener('click',()=>saveStatus(button.dataset.save));
  });

  document.querySelectorAll('[data-verify]').forEach(button=>{
    button.addEventListener('click',()=>verifyPayment(button.dataset.verify));
  });

  document.querySelectorAll('[data-save-wa]').forEach(button=>{
    button.addEventListener('click',()=>saveWhatsAppNumber(button.dataset.saveWa));
  });
}

/* SAVE CUSTOMER WHATSAPP NUMBER */
async function saveWhatsAppNumber(id){
  const input=$('wa-'+id);
  const phone=validWhatsApp(input?.value);

  if(!phone){
    say('Enter a valid WhatsApp number with country code. Example: 919876543210');
    return;
  }

  say('Saving WhatsApp number…');

  const {error}=await supabase.from('tycf_orders')
    .update({whatsapp_recipient:phone})
    .eq('id',id);

  if(error){
    say('WhatsApp number save failed: '+error.message);
    return;
  }

  await loadAll();
  say('WhatsApp number saved.');
}

/* VERIFY PAYMENT */
async function verifyPayment(id){
  const order=orders.find(o=>String(o.id)===String(id));
  if(!order)return;

  if(order.payment_status==='Paid'){
    say('This booking is already marked Paid.');
    return;
  }

  if(!confirm('Has the payment actually reached the TYCF Foundation account and been verified?'))return;

  say('Updating payment status…');

  const {error}=await supabase.from('tycf_orders')
    .update({payment_status:'Paid',status:'Confirmed'})
    .eq('id',id);

  if(error){
    say('Payment update failed: '+error.message);
    return;
  }

  await loadAll();
  say('Payment marked Paid and booking Confirmed. You can now send WhatsApp confirmation.');
}

/* SAVE BOOKING STATUS */
async function saveStatus(id){
  const status=$('st-'+id).value;
  const order=orders.find(o=>String(o.id)===String(id));

  if(status==='Confirmed'&&order?.payment_status!=='Paid'){
    say('Verify payment before confirming this booking.');
    return;
  }

  say('Saving booking status…');

  const {error}=await supabase.from('tycf_orders')
    .update({status})
    .eq('id',id);

  if(error){
    say('Status update failed: '+error.message);
    return;
  }

  await loadAll();
  say('Booking status updated.');
}

/* REMINDERS */
function renderReminders(){
  const days=Number(settings.reminder_days||1);

  const due=orders.filter(order=>
    order.donation_date===datePlus(days)&&
    !['Delivered','Cancelled'].includes(order.status)
  );

  $('reminderList').innerHTML=due.length
    ?due.map(order=>`
      <div class="order">
        <b>${esc(order.customer_name)}</b> — ${esc(order.package_name)}
        <p class="muted">${esc(order.customer_mobile)} · ${esc(order.donation_date)} · ${esc(order.status)}</p>
      </div>`).join('')
    :'<p>No donations due on the reminder date.</p>';
}

/* SETTINGS */
function fillSettings(){
  $('waNumber').value=settings.whatsapp_number||'';
  $('vegPrice').value=settings.veg_price??1500;
  $('eggPrice').value=settings.egg_price??1800;
  $('chickenPrice').value=settings.chicken_price??2500;
  $('cakePrice').value=settings.cake_price??1500;
  $('reminderDays').value=settings.reminder_days??1;
}

/* ADMIN PROFILE */
$('profileForm').addEventListener('submit',async event=>{
  event.preventDefault();

  const displayName=$('displayName').value.trim();
  const newEmail=$('newAdminEmail').value.trim();

  if(!displayName){
    say('Enter a display name.');
    return;
  }

  say('Saving admin profile…');

  const update={data:{display_name:displayName}};
  if(newEmail&&newEmail!==currentEmail)update.email=newEmail;

  const {error}=await supabase.auth.updateUser(update);

  if(error){
    say('Profile update failed: '+error.message);
    return;
  }

  $('adminDisplayName').textContent=displayName;

  if(update.email){
    currentEmail=newEmail;
    say('Profile saved. Check your email inbox to confirm the email change.');
  }else{
    say('Admin display name saved.');
  }
});

/* PACKAGE AND FOUNDATION WHATSAPP SETTINGS */
$('settingsForm').addEventListener('submit',async event=>{
  event.preventDefault();

  const update={
    whatsapp_number:$('waNumber').value.replace(/\D/g,''),
    veg_price:Number($('vegPrice').value),
    egg_price:Number($('eggPrice').value),
    chicken_price:Number($('chickenPrice').value),
    cake_price:Number($('cakePrice').value),
    reminder_days:Number($('reminderDays').value)
  };

  if(!/^\d{10,15}$/.test(update.whatsapp_number)){
    say('Enter Foundation WhatsApp number with country code.');
    return;
  }

  if(
    update.veg_price<1||
    update.egg_price<1||
    update.chicken_price<1||
    update.cake_price<1||
    update.reminder_days<1||
    update.reminder_days>30
  ){
    say('Please check all settings fields.');
    return;
  }

  say('Saving settings…');

  const {error}=await supabase.from('tycf_settings')
    .update(update)
    .not('id','is',null);

  if(error){
    say('Settings save failed: '+error.message);
    return;
  }

  await loadAll();
  say('Package and WhatsApp settings saved.');
});

/* UPI QR SETTINGS */
const QR_PATH='current/payment-qr';

async function loadQr(){
  const {data}=supabase.storage
    .from('tycf-payment-qr')
    .getPublicUrl(QR_PATH);

  const url=data.publicUrl+'?v='+Date.now();
  $('qrPreviewWrap').innerHTML='<p class="muted">Checking current QR…</p>';

  try{
    const response=await fetch(url,{method:'HEAD'});

    $('qrPreviewWrap').innerHTML=response.ok
      ?`<img src="${url}" alt="Current UPI QR">`
      :'<p class="muted">No QR uploaded yet.</p>';
  }catch(error){
    $('qrPreviewWrap').innerHTML='<p class="muted">Could not load QR preview.</p>';
  }
}

$('qrForm').addEventListener('submit',async event=>{
  event.preventDefault();

  const file=$('qrFile').files[0];
  if(!file){
    say('Choose a QR image first.');
    return;
  }

  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
    say('Use JPG, PNG or WebP image.');
    return;
  }

  if(file.size>5*1024*1024){
    say('Image must be 5 MB or smaller.');
    return;
  }

  say('Uploading QR…');

  const {error}=await supabase.storage
    .from('tycf-payment-qr')
    .upload(QR_PATH,file,{
      upsert:true,
      contentType:file.type,
      cacheControl:'0'
    });

  if(error){
    say('QR upload failed: '+error.message);
    return;
  }

  $('qrFile').value='';
  await loadQr();
  say('UPI QR uploaded successfully.');
});

/* DELETE QR */
$('deleteQrBtn').addEventListener('click',async()=>{
  if(!confirm('Delete the current TYCF payment QR?'))return;

  say('Deleting current QR…');

  const {error}=await supabase.storage
    .from('tycf-payment-qr')
    .remove([QR_PATH]);

  if(error){
    say('QR delete failed: '+error.message);
    return;
  }

  $('qrPreviewWrap').innerHTML='<p class="muted">No QR uploaded yet.</p>';
  $('qrFile').value='';
  say('Current payment QR deleted.');
});

/* TABS */
function showTab(name){
  ['bookings','reminders','settings','qr'].forEach(tab=>{
    $(tab+'Tab').hidden=tab!==name;
  });

  if(name==='qr')loadQr();
}

document.querySelectorAll('[data-tab]').forEach(button=>{
  button.addEventListener('click',()=>{
    showTab(button.dataset.tab);
  });
});

/* REFRESH */
$('refreshBtn').addEventListener('click',loadAll);

/* LOGOUT */
$('logoutBtn').addEventListener('click',async()=>{
  say('Signing out…');
  await supabase.auth.signOut();
  location.href='admin.html';
});

/* SEARCH AND FILTER */
$('search').addEventListener('input',renderOrders);
$('statusFilter').addEventListener('change',renderOrders);

/* START DASHBOARD */
init();
</script>
</body>
</html>
